appId: org.ramflux.android
---
# Demo B step 07 (B7): offline, then reconnect and catch up.
# Operator sequence (Maestro cannot wait for external events, so run in this order):
#   1. terminate the app on the device (simulator: `xcrun simctl terminate <UDID> org.ramflux.ios`).
#   2. rf peer sends 20 DMs "${OFFLINE_PREFIX} 01".."${OFFLINE_PREFIX} 20" and 3 group messages "${OFFLINE_PREFIX} group 1..3".
#   3. run this flow; it relaunches the app and asserts every message is visible.
# Recipient-side checks on the phone: all 23 messages present, in order (order is checked with rf receipts).
# Catch-up timing, single fetch, mid-batch kill and both storage modes are checked with rf/logs, not here.
- launchApp
- runFlow: common/unlock.yaml
- runFlow: common/open_conversation.yaml
- extendedWaitUntil:
    visible:
      text: "${OFFLINE_PREFIX} 20"
    timeout: 120000
- assertVisible:
    text: "${OFFLINE_PREFIX} 01"
- assertVisible:
    text: "${OFFLINE_PREFIX} 10"
- assertVisible:
    text: "${OFFLINE_PREFIX} 19"
- assertVisible:
    text: "${OFFLINE_PREFIX} group 3"
