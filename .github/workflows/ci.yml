# SPDX-License-Identifier: AGPL-3.0-or-later
name: Android client
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/check-secret-boundary.py
      - run: python3 scripts/check-client-architecture.py
      - run: python3 scripts/check-os-permissions.py
      - run: python3 scripts/check-ui-resources.py
      - run: python3 scripts/test-theme-catalog.py
      - run: python3 scripts/test-ui-resource-guard.py
      - run: ./gradlew ktlintCheck :app:testDebugUnitTest :core:sdk:testDebugUnitTest :core:data:testDebugUnitTest :feature:permissions:test:testDebugUnitTest :feature:app-shell:test:testDebugUnitTest :feature:onboarding:test:testDebugUnitTest :feature:conversations:test:testDebugUnitTest :feature:chat:test:testDebugUnitTest :feature:settings:test:testDebugUnitTest --console=plain
      - run: python3 scripts/check-os-permissions.py
      - name: Record client screenshots
        run: ./gradlew :feature:app-shell:test:recordRoborazziDebug :feature:onboarding:test:recordRoborazziDebug :feature:conversations:test:recordRoborazziDebug :feature:chat:test:recordRoborazziDebug :feature:settings:test:recordRoborazziDebug :feature:permissions:test:recordRoborazziDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-bridge-results
          path: |
            core/*/build/reports/
            core/*/build/test-results/
            feature/**/build/reports/
            feature/**/build/test-results/
            feature/**/build/outputs/roborazzi/
  native-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          path: android
      - name: Read pinned SDK revision
        id: sdk-pin
        run: python3 -c 'import json,os; p=json.load(open("sdk-contract/pin.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("revision="+p["revision"]+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: ramfluxhq/ramflux
          ref: ${{ steps.sdk-pin.outputs.revision }}
          path: sdk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
          key: cargo-mobile-v1-${{ runner.os }}-${{ runner.arch }}-ndk4.1.2-${{ hashFiles('sdk/Cargo.lock') }}
          restore-keys: cargo-mobile-v1-${{ runner.os }}-${{ runner.arch }}-ndk4.1.2-
      - name: Install the SDK Rust toolchain and cargo-ndk
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android
          if [[ "$(cargo ndk --version 2>/dev/null || true)" != "cargo-ndk 4.1.2" ]]; then
            cargo install cargo-ndk --version 4.1.2 --locked --force
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: native-target
          key: native-release-symbols-v1-${{ runner.os }}-${{ steps.sdk-pin.outputs.revision }}
          restore-keys: native-release-symbols-v1-${{ runner.os }}-
      - name: Assemble shipping-profile AAR and consumer APK
        env:
          RAMFLUX_CORE_DIR: ${{ github.workspace }}/sdk
          CARGO_TARGET_DIR: ${{ github.workspace }}/native-target
        run: ./gradlew :app:assembleDebug :core:sdk:assembleRelease :fixtures:packaging:assembleRelease lint --console=plain
      - name: Check every packaged ELF and APK zip alignment
        run: python3 scripts/check-packaged-alignment.py core/sdk/build/outputs/aar/sdk-release.aar fixtures/packaging/build/outputs/apk/release/packaging-release-unsigned.apk app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: native-packaging
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/core/sdk/build/outputs/aar/sdk-release.aar
            android/fixtures/packaging/build/outputs/apk/release/packaging-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: native-debug-symbols
          if-no-files-found: error
          path: android/core/sdk/build/generated/native/symbols/
