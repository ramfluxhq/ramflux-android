# SPDX-License-Identifier: AGPL-3.0-or-later
name: Android client
# Runs on the promotion to main and on main only; next is gated by real verification.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      # The key follows only the Robolectric version and the API 28/35 jar versions in
      # libs.versions.toml, so adding an unrelated library does not force a fresh
      # download of the large jars (Maven Central throttles those with 429).
      - name: Compute the Robolectric jar cache key
        id: robolectric-key
        run: python3 scripts/robolectric-cache-key.py
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: robolectric-jars
          key: robolectric-android-all-v2-${{ runner.os }}-${{ steps.robolectric-key.outputs.hash }}
          restore-keys: |
            robolectric-android-all-v2-${{ runner.os }}-
            robolectric-android-all-v1-${{ runner.os }}-
      - run: python3 scripts/check-secret-boundary.py
      - run: python3 scripts/check-client-architecture.py
      - run: python3 scripts/check-app-lock-windows.py
      - run: python3 scripts/check-os-permissions.py
      - run: python3 scripts/test-native-emulator.py
      - run: python3 scripts/check-ui-resources.py
      - run: python3 scripts/check-mobile-tokens.py core/designsystem/mobile-kit-tokens.json
      - run: python3 scripts/test-theme-catalog.py
      - run: python3 scripts/test-ui-resource-guard.py
      - run: python3 scripts/test-board-compare.py
      - run: python3 scripts/sync-board-references.py check app/src/test/resources/shell-previews
      - run: ./gradlew ktlintCheck :core:designsystem:testDebugUnitTest :app:testDebugUnitTest :core:navigation:testDebugUnitTest :core:sdk:testDebugUnitTest :core:data:testDebugUnitTest :core:media:testDebugUnitTest :feature:permissions:test:testDebugUnitTest :feature:cards:test:testDebugUnitTest :feature:tasks:test:testDebugUnitTest :feature:agents:test:testDebugUnitTest :feature:calls:test:testDebugUnitTest :feature:groups:test:testDebugUnitTest :feature:app-shell:test:testDebugUnitTest :feature:onboarding:test:testDebugUnitTest :feature:conversations:test:testDebugUnitTest :feature:chat:test:testDebugUnitTest :feature:settings:test:testDebugUnitTest :feature:contacts:test:testDebugUnitTest :push:api:testDebugUnitTest :push:impl:testDebugUnitTest :push:international:compat:testDebugUnitTest :push:international:fcm:testDebugUnitTest --console=plain
      - run: python3 scripts/check-os-permissions.py
      - name: Record client screenshots
        run: ./gradlew :feature:app-shell:test:recordRoborazziDebug :feature:onboarding:test:recordRoborazziDebug :feature:conversations:test:recordRoborazziDebug :feature:chat:test:recordRoborazziDebug :feature:settings:test:recordRoborazziDebug :feature:permissions:test:recordRoborazziDebug :feature:cards:test:recordRoborazziDebug :feature:tasks:test:recordRoborazziDebug :feature:agents:test:recordRoborazziDebug :feature:calls:test:recordRoborazziDebug :feature:groups:test:recordRoborazziDebug :feature:contacts:test:recordRoborazziDebug --console=plain
      - name: Record kit screenshots and compare master frames
        run: |
          CI=true ./gradlew :core:designsystem:recordRoborazziDebug --tests org.ramflux.designsystem.kit.KitScreenshotTest --console=plain
          python3 scripts/compare-kit-previews.py core/designsystem/kit-previews core/designsystem/build/outputs/roborazzi core/designsystem/build/outputs/kit-compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-kit-screenshots
          if-no-files-found: error
          path: |
            core/designsystem/build/outputs/roborazzi/
            core/designsystem/build/outputs/roborazzi-variants/
            core/designsystem/build/outputs/kit-compare/
      # Board captures are compared pixel by pixel with the current design exports. Reviewed
      # deviations (the alignment work list) are reported as KNOWN; any new deviation fails.
      - name: Record shell screenshots and compare board frames
        run: |
          CI=true ./gradlew :app:recordRoborazziDebug --tests org.ramflux.android.shell.ShellBoardScreenshotTest --console=plain
          python3 scripts/compare-board-captures.py app/src/test/resources/shell-previews app/build/outputs/shell-roborazzi app/build/outputs/shell-compare --expected app/src/test/resources/shell-previews/expected-deviations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-shell-screenshots
          if-no-files-found: error
          path: |
            app/build/outputs/shell-roborazzi/
            app/build/outputs/shell-compare/
            app/build/outputs/shell-matrix/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-bridge-results
          path: |
            core/*/build/reports/
            core/*/build/test-results/
            feature/**/build/reports/
            feature/**/build/test-results/
            feature/**/build/outputs/roborazzi/
  native-packaging:
    runs-on: ubuntu-latest
    # 60 minutes is enough wall clock. The 11d31e4 failure was not this limit:
    # rustc of ramflux-sdk was SIGKILL'd about 14 minutes in (signal 9), and the
    # runner then shut the step down with exit 143. Some hosted images now
    # already swap on /swapfile; the swap step must not fallocate that live file.
    # ffi-release codegen-units=1 holds that crate in one LLVM module.
    timeout-minutes: 60
    env:
      # Two jobs compile neighbors during thin LTO and raise the peak. Stay at one.
      CARGO_BUILD_JOBS: "1"
      # Opt-level 3 and thin LTO stay. More codegen units keep each LLVM module
      # smaller so the hosted runner does not kill rustc. Line tables stay on in
      # build-native.sh so the symbol artifact still has them.
      CARGO_PROFILE_FFI_RELEASE_CODEGEN_UNITS: "16"
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          path: android
      - name: Read pinned SDK revision
        id: sdk-pin
        run: python3 -c 'import json,os; p=json.load(open("sdk-contract/pin.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("revision="+p["revision"]+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: ramfluxhq/ramflux
          ref: ${{ steps.sdk-pin.outputs.revision }}
          path: sdk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
          key: cargo-mobile-v1-${{ runner.os }}-${{ runner.arch }}-ndk4.1.2-${{ hashFiles('sdk/Cargo.lock') }}
          restore-keys: cargo-mobile-v1-${{ runner.os }}-${{ runner.arch }}-ndk4.1.2-
      - name: Install the SDK Rust toolchain and cargo-ndk
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android
          if [[ "$(cargo ndk --version 2>/dev/null || true)" != "cargo-ndk 4.1.2" ]]; then
            cargo install cargo-ndk --version 4.1.2 --locked --force
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: native-target
          key: native-release-symbols-v1-${{ runner.os }}-${{ steps.sdk-pin.outputs.revision }}
          restore-keys: native-release-symbols-v1-${{ runner.os }}-
      - name: Exercise ELF guard regressions with real ARM fixtures
        run: python3 scripts/test-packaged-elf-guard.py
      - name: Add swap so thin LTO can exceed RAM without SIGKILL
        run: |
          free -h
          df -h /
          # Hosted images already swap on /swapfile. fallocate of that live file
          # returns "Text file busy". Never swapoff or remove /swapfile. Add the
          # rest of an 8GB cap at /mnt/rf-swap. A later run that finds this path
          # already active leaves both files alone.
          swapfile=/mnt/rf-swap
          if awk 'NR>1 {print $1}' /proc/swaps | grep -Fxq "$swapfile"; then
            echo "$swapfile already active"
            free -h
            exit 0
          fi
          existing_kb=$(awk '/^SwapTotal:/ {print $2}' /proc/meminfo)
          target_kb=$((8 * 1024 * 1024))
          need_kb=$((target_kb - existing_kb))
          if (( need_kb < 512 * 1024 )); then
            echo "swap already ${existing_kb}KB; keeping the runner swapfile"
            exit 0
          fi
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          reserve_kb=$((4 * 1024 * 1024))
          swap_kb=$((avail_kb - reserve_kb))
          if (( swap_kb > need_kb )); then swap_kb=$need_kb; fi
          if (( swap_kb < 512 * 1024 )); then
            if (( existing_kb >= 2 * 1024 * 1024 )); then
              echo "keeping existing swap ${existing_kb}KB; no room for more"
              exit 0
            fi
            echo "Only ${avail_kb}KB free after reserving 4GB and no usable swap"
            exit 1
          fi
          if [[ -e "$swapfile" ]]; then
            sudo rm -f "$swapfile"
          fi
          sudo fallocate -l "${swap_kb}K" "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h
      - name: Link the shipping native library alone
        env:
          RAMFLUX_CORE_DIR: ${{ github.workspace }}/sdk
          CARGO_TARGET_DIR: ${{ github.workspace }}/native-target
          CARGO_BUILD_JOBS: 1
        run: bash scripts/build-native.sh core/sdk/build/generated/native
      - name: Assemble shipping-profile AAR and consumer APK
        env:
          RAMFLUX_CORE_DIR: ${{ github.workspace }}/sdk
          CARGO_TARGET_DIR: ${{ github.workspace }}/native-target
          CARGO_BUILD_JOBS: 1
          RAMFLUX_NATIVE_PREBUILT: 1
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :core:sdk:assembleRelease :fixtures:packaging:assembleRelease lint --console=plain
      - name: Check every packaged ELF and APK zip alignment
        run: python3 scripts/check-packaged-alignment.py core/sdk/build/outputs/aar/sdk-release.aar fixtures/packaging/build/outputs/apk/release/packaging-release-unsigned.apk app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: native-packaging
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/core/sdk/build/outputs/aar/sdk-release.aar
            android/fixtures/packaging/build/outputs/apk/release/packaging-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: native-debug-symbols
          if-no-files-found: error
          path: android/core/sdk/build/generated/native/symbols/

      - uses: actions/upload-artifact@v4
        with:
          name: native-runtime-apks
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  native-runtime:
    needs: native-packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator system-images;android-35;google_apis;x86_64
      - uses: actions/download-artifact@v4
        with:
          name: native-runtime-apks
          path: packaged
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise packaged ARM libraries with one boot-only retry
        run: python3 scripts/run-native-emulator.py --app packaged/debug/app-debug.apk --test packaged/androidTest/debug/app-debug-androidTest.apk --output native-runtime-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-runtime-results
          path: native-runtime-results/
