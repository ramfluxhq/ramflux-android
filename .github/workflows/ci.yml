# SPDX-License-Identifier: AGPL-3.0-or-later
name: Android bridge
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:sdk:compileDebugKotlin :core:data:compileDebugKotlin :core:sdk:testDebugUnitTest :core:data:testDebugUnitTest lint --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-bridge-results
          path: |
            core/*/build/reports/
            core/*/build/test-results/
